suite: CronJob
templates:
  - cronjob.yaml
release:
  name: av-scanner
  namespace: av-scanner
set:
  sshKey.existingSecret: test-ssh-key
tests:
  - it: should render a CronJob with default values
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: av-scanner-deploy
      - equal:
          path: spec.schedule
          value: "0 */12 * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: should use custom schedule
    set:
      cronjob.schedule: "0 */6 * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */6 * * *"

  - it: should set correct image
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/null-ptr-exception/av-scanner:20260503-r1

  - it: should use custom image registry
    set:
      image.registry: registry.example.com
      image.repository: my-org/av-scanner
      image.tag: v1.0.0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: registry.example.com/my-org/av-scanner:v1.0.0

  - it: should set token env vars
    set:
      token.serviceAccount: custom-sa
      token.duration: 48h
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SA_NAME
            value: "custom-sa"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TOKEN_DURATION
            value: "48h"

  - it: should set SA_NAMESPACE to release namespace
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SA_NAMESPACE
            value: "av-scanner"

  - it: should run token-refresh playbook
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value:
            - ansible-playbook
            - playbooks/token-refresh.yaml

  - it: should mount inventory configmap
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: inventory
            mountPath: /etc/ansible
            readOnly: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: inventory
            configMap:
              name: av-scanner-inventory

  - it: should mount ssh key secret
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: ssh-key
            secret:
              secretName: test-ssh-key
              defaultMode: 256

  - it: should use custom ssh key secret
    set:
      sshKey.existingSecret: my-ssh-secret
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: ssh-key
            secret:
              secretName: my-ssh-secret
              defaultMode: 256

  - it: should use deployer service account
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: av-scanner-deployer
