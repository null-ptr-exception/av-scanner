suite: ServiceAccounts
templates:
  - serviceaccount.yaml
release:
  name: av-scanner
  namespace: av-scanner
tests:
  - it: should create two service accounts
    asserts:
      - hasDocuments:
          count: 2

  - it: should create token SA with configured name
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: av-scanner

  - it: should create deployer SA
    documentIndex: 1
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: av-scanner-deployer

  - it: should use custom token SA name
    set:
      token.serviceAccount: custom-sa
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
