suite: Post-install Deploy Hook
templates:
  - hook-deploy.yaml
release:
  name: av-scanner
  namespace: av-scanner
set:
  sshKey.existingSecret: test-ssh-key
tests:
  - it: should not render when disabled
    set:
      autoDeploy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: av-scanner-deploy

  - it: should have post-install hook annotation
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: should run token-refresh then deploy
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "token-refresh\\.yaml[\\s\\S]*deploy\\.yaml"

  - it: should set token env vars
    set:
      token.serviceAccount: custom-sa
      token.duration: 48h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SA_NAME
            value: "custom-sa"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_DURATION
            value: "48h"

  - it: should use deployer service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: av-scanner-deployer

  - it: should mount ssh key and inventory
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-key
            mountPath: /ssh
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: inventory
            mountPath: /etc/ansible
            readOnly: true
