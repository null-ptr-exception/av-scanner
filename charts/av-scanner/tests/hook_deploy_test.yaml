suite: Post-install/upgrade Deploy Hook
templates:
  - hook-deploy.yaml
release:
  name: av-scanner
  namespace: av-scanner
set:
  sshKey.existingSecret: test-ssh-key
tests:
  - it: should not render when disabled
    set:
      autoDeploy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: av-scanner-deploy

  - it: should have post-install and post-upgrade hook annotation
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: should set default job params
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  - it: should use custom job params
    set:
      autoDeploy.backoffLimit: 1
      autoDeploy.activeDeadlineSeconds: 300
      autoDeploy.ttlSecondsAfterFinished: 7200
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 1
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 7200

  - it: should run deploy playbook
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - ansible-playbook
            - playbooks/deploy.yaml

  - it: should set token env vars
    set:
      token.serviceAccount: custom-sa
      token.duration: 48h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SA_NAME
            value: "custom-sa"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_DURATION
            value: "48h"

  - it: should use deployer service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: av-scanner-deployer

  - it: should mount ssh key and inventory
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-key
            mountPath: /ssh
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: inventory
            mountPath: /etc/ansible
            readOnly: true
