suite: SSH Key Secret
templates:
  - secret.yaml
release:
  name: av-scanner
  namespace: av-scanner
tests:
  - it: should create SSH key secret by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: av-scanner-ssh-key

  - it: should not create secret when existingSecret is set
    set:
      sshKey.existingSecret: my-ssh-secret
    asserts:
      - hasDocuments:
          count: 0
