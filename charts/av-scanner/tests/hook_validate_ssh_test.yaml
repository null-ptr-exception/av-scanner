suite: Pre-install SSH Validation Hook
templates:
  - hook-validate-ssh.yaml
release:
  name: av-scanner
  namespace: av-scanner
set:
  sshKey.existingSecret: test-ssh-key
tests:
  - it: should not render when disabled
    set:
      preInstallCheck.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: av-scanner-validate-ssh

  - it: should have pre-install hook annotation
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install

  - it: should have hook delete policy
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: should use default job settings
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 180
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  - it: should allow custom job settings
    set:
      preInstallCheck.backoffLimit: 2
      preInstallCheck.activeDeadlineSeconds: 300
      preInstallCheck.ttlSecondsAfterFinished: 7200
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 7200

  - it: should pass inventory via env var
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INVENTORY
            value: |
              all:
                vars:
                  ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
                  ansible_ssh_private_key_file: /ssh/id_ed25519
                children:
                  av_scanner:
                    hosts:
                      vm1:
                        ansible_host: 192.168.64.2
                        ansible_user: ubuntu
                      vm2:
                        ansible_host: 192.168.64.3
                        ansible_user: ubuntu

  - it: should mount ssh key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-key
            mountPath: /ssh
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ssh-key
            secret:
              secretName: test-ssh-key
              defaultMode: 256
