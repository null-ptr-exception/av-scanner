suite: Controller Deployment
templates:
  - controller.yaml
release:
  name: av-scanner
  namespace: av-scanner
set:
  sshKey.existingSecret: test-ssh-key
tests:
  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      controller.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: av-scanner-controller

  - it: should use sleep infinity command
    set:
      controller.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sleep", "infinity"]

  - it: should use deployer service account
    set:
      controller.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: av-scanner-deployer

  - it: should set token env vars
    set:
      controller.enabled: true
      token.serviceAccount: custom-sa
      token.duration: 48h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SA_NAME
            value: "custom-sa"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_DURATION
            value: "48h"

  - it: should mount ssh key and inventory
    set:
      controller.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ssh-key
            mountPath: /ssh
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: inventory
            mountPath: /etc/ansible
            readOnly: true
