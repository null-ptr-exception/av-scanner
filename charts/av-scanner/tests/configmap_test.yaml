suite: Inventory ConfigMap
templates:
  - configmap.yaml
release:
  name: av-scanner
  namespace: av-scanner
tests:
  - it: should create inventory configmap
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: av-scanner-inventory

  - it: should contain inventory data
    asserts:
      - exists:
          path: data["hosts"]
      - matchRegex:
          path: data["hosts"]
          pattern: "ansible_host.*192\\.168\\.64\\.2"
