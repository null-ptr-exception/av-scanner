nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: null-ptr-exception/av-scanner
  # tag defaults to Chart.appVersion; override to pin a specific image
  tag: ""

cronjob:
  schedule: "0 */12 * * *"

controller:
  enabled: true

token:
  duration: 168h
  serviceAccount: av-scanner

# SSH private key for connecting to VMs (required).
# The secret must contain a key named "id_ed25519" with the private key.
sshKey:
  existingSecret: ""

inventory: |
  all:
    vars:
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      ansible_ssh_private_key_file: /ssh/id_ed25519
    hosts:
      vm1:
        ansible_host: 192.168.64.2
        ansible_user: ubuntu
      vm2:
        ansible_host: 192.168.64.3
        ansible_user: ubuntu

# Pre-install hook that validates SSH connectivity to all inventory hosts
# by running "ansible all -m ping" before deploying workloads.
preInstallCheck:
  enabled: true
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600

# Post-install/upgrade hooks that automatically deploy to VMs.
# Post-install: mints token + full deploy. Post-upgrade: deploy only (no new token).
autoDeploy:
  enabled: true

istio:
  enabled: false
  # <namespace>/<name> of the Istio Gateway resource
  gatewayRef: ""
  # Namespace where the gateway pods run (for exportTo)
  gatewayNamespace: istio-system
  port: 3000
  # Real external FQDN that the gateway matches on (Host header)
  virtualServiceHost: av-scanner.corp.example.com
  # Internal routing identifier registered in ServiceEntry (does not need real DNS)
  serviceEntryHost: av-scanner.internal
  loadBalancer: LEAST_CONN
  outlierDetection:
    consecutive5xxErrors: 3
    interval: 30s
    baseEjectionTime: 2m
    maxEjectionPercent: 100
  # VM endpoints
  endpoints: []
  # - address: 192.168.64.2
  # - address: 192.168.64.3
