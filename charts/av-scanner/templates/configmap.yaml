{{- if not .Values.existingInventoryPath }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "av-scanner.fullname" . }}-inventory
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
data:
  inventory.yaml: |
    {{- .Values.inventory | nindent 4 }}
{{- end }}
