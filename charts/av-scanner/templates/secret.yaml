{{- if not .Values.sshKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "av-scanner.fullname" . }}-ssh-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
type: Opaque
data:
  id_ed25519: ""  # base64-encoded SSH private key — populate before first deploy
{{- end }}
