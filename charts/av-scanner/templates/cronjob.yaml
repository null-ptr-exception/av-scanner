apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "av-scanner.fullname" . }}-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            app.kubernetes.io/name: av-scanner-deploy
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "av-scanner.fullname" . }}-deployer
          restartPolicy: Never
          containers:
            - name: deploy
              image: {{ include "av-scanner.image" . }}
              command:
                - ansible-playbook
                - playbooks/token-refresh.yaml
              env:
                - name: SA_NAME
                  value: {{ .Values.token.serviceAccount | quote }}
                - name: SA_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: TOKEN_DURATION
                  value: {{ .Values.token.duration | quote }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
                - name: inventory
                  mountPath: /etc/ansible
                  readOnly: true
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: ssh-key
              secret:
                secretName: {{ include "av-scanner.sshSecretName" . }}
                defaultMode: 0400
            - name: inventory
              configMap:
                name: {{ include "av-scanner.fullname" . }}-inventory
