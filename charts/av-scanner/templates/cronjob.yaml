apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "av-scanner.fullname" . }}-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: {{ include "av-scanner.fullname" . }}-deployer
          restartPolicy: Never
          containers:
            - name: deploy
              image: {{ include "av-scanner.image" . }}
              env:
                - name: SA_NAME
                  value: {{ .Values.token.serviceAccount | quote }}
                - name: SA_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: TOKEN_DURATION
                  value: {{ .Values.token.duration | quote }}
                - name: INVENTORY_PATH
                  value: {{ include "av-scanner.inventoryPath" . | quote }}
              volumeMounts:
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
                {{- if not .Values.existingInventoryPath }}
                - name: inventory
                  mountPath: /etc/ansible
                  readOnly: true
                {{- end }}
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: ssh-key
              secret:
                secretName: {{ include "av-scanner.sshSecretName" . }}
                defaultMode: 0400
            {{- if not .Values.existingInventoryPath }}
            - name: inventory
              configMap:
                name: {{ include "av-scanner.fullname" . }}-inventory
            {{- end }}
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
