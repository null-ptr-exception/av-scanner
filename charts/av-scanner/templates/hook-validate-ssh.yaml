{{- if .Values.preInstallCheck.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "av-scanner.fullname" . }}-validate-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.preInstallCheck.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.preInstallCheck.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.preInstallCheck.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validate-ssh
          image: {{ include "av-scanner.image" . }}
          command:
            - sh
            - -c
            - |
              echo "$INVENTORY" > /tmp/hosts
              ansible all -m ping -i /tmp/hosts
          env:
            - name: INVENTORY
              value: {{ .Values.inventory | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ssh-key
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: {{ include "av-scanner.sshSecretName" . }}
            defaultMode: 0400
{{- end }}
