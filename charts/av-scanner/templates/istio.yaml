{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.istio.serviceHost }}
  location: MESH_INTERNAL
  ports:
  - number: {{ .Values.istio.port }}
    name: http
    protocol: HTTP
  resolution: STATIC
  workloadSelector:
    labels:
      app: av-scanner
{{- range .Values.istio.workloadEntries }}
---
apiVersion: networking.istio.io/v1beta1
kind: WorkloadEntry
metadata:
  name: {{ include "av-scanner.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" $ | nindent 4 }}
    app: av-scanner
spec:
  address: {{ .address }}
  labels:
    app: av-scanner
    instance: {{ .name }}
{{- end }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.istio.serviceHost }}
  gateways:
  - {{ .Values.istio.gatewayRef }}
  http:
  - route:
    - destination:
        host: {{ .Values.istio.serviceHost }}
        port:
          number: {{ .Values.istio.port }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  host: {{ .Values.istio.serviceHost }}
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
{{- end }}
