{{- if .Values.istio.enabled }}
{{- $gatewayRef := required "istio.gatewayRef is required when istio.enabled=true" .Values.istio.gatewayRef -}}
{{- if eq (len .Values.istio.endpoints) 0 -}}
{{- fail "istio.endpoints must contain at least one entry when istio.enabled=true" -}}
{{- end }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.istio.serviceHost }}
  gateways:
  - {{ $gatewayRef }}
  http:
  - route:
    - destination:
        host: {{ .Values.istio.serviceHost }}
        port:
          number: {{ .Values.istio.port }}
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.istio.serviceHost }}
  ports:
  - number: {{ .Values.istio.port }}
    name: http
    protocol: HTTP
  resolution: STATIC
  location: MESH_EXTERNAL
  endpoints:
  {{- range .Values.istio.endpoints }}
  - address: {{ .address }}
  {{- end }}
  exportTo:
  - "."
  - {{ .Values.istio.gatewayNamespace | quote }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "av-scanner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
spec:
  host: {{ .Values.istio.serviceHost }}
  trafficPolicy:
    loadBalancer:
      simple: {{ .Values.istio.loadBalancer }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.istio.outlierDetection.consecutive5xxErrors }}
      interval: {{ .Values.istio.outlierDetection.interval }}
      baseEjectionTime: {{ .Values.istio.outlierDetection.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.istio.outlierDetection.maxEjectionPercent }}
{{- end }}
