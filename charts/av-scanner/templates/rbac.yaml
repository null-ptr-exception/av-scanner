apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "av-scanner.fullname" . }}-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["{{ .Values.token.serviceAccount }}"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "av-scanner.fullname" . }}-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "av-scanner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "av-scanner.fullname" . }}-deployer
subjects:
  - kind: ServiceAccount
    name: {{ include "av-scanner.fullname" . }}-deployer
    namespace: {{ .Release.Namespace }}
