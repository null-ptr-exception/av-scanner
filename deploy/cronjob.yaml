apiVersion: v1
kind: Namespace
metadata:
  name: av-scanner
---
# SA whose token av-scanner uses to authenticate to kube-federated-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: av-scanner
  namespace: av-scanner
---
# SA for the deployer CronJob pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: av-scanner-deployer
  namespace: av-scanner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: av-scanner-deployer
  namespace: av-scanner
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["av-scanner"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: av-scanner-deployer
  namespace: av-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: av-scanner-deployer
subjects:
  - kind: ServiceAccount
    name: av-scanner-deployer
    namespace: av-scanner
---
apiVersion: v1
kind: Secret
metadata:
  name: av-scanner-ssh-key
  namespace: av-scanner
type: Opaque
data:
  id_ed25519: ""  # base64-encoded SSH private key — populate before first deploy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: av-scanner-deploy
  namespace: av-scanner
spec:
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: av-scanner-deployer
          restartPolicy: Never
          containers:
            - name: deploy
              image: av-scanner-deploy:latest
              env:
                - name: SA_NAME
                  value: "av-scanner"
                - name: SA_NAMESPACE
                  value: "av-scanner"
                - name: TOKEN_DURATION
                  value: "24h"
                - name: AV_SCANNER_IP
                  value: ""  # target VM IP
                - name: AV_SCANNER_KEY
                  value: "/ssh/id_ed25519"
              volumeMounts:
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
          volumes:
            - name: ssh-key
              secret:
                secretName: av-scanner-ssh-key
                defaultMode: 0400
