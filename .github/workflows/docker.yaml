name: Docker Image

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Check for existing image
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository }}:${VERSION} >/dev/null 2>&1; then
            echo "ERROR: image ghcr.io/${{ github.repository }}:${VERSION} already exists"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
