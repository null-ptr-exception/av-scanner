name: Docker Image

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository }}:${{ github.ref_name }} >/dev/null 2>&1; then
            echo "ERROR: image ghcr.io/${{ github.repository }}:${{ github.ref_name }} already exists"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
