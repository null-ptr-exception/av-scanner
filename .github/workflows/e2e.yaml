name: E2E Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./...

  e2e:
    runs-on: [self-hosted, nuc-rophy]
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: |
          if ! command -v bats &>/dev/null || ! command -v cloud-localds &>/dev/null || ! command -v virt-install &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              bats cloud-image-utils virtinst libvirt-daemon-system qemu-utils
          fi

      - name: Install minikube
        run: |
          if ! command -v minikube &>/dev/null; then
            curl -Lo /tmp/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            chmod +x /tmp/minikube && sudo mv /tmp/minikube /usr/local/bin/minikube
          fi

      - name: Install kubectl
        run: |
          if ! command -v kubectl &>/dev/null; then
            KVER="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
            curl -Lo /tmp/kubectl "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
            curl -Lo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl.sha256"
            echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
            chmod +x /tmp/kubectl && sudo mv /tmp/kubectl /usr/local/bin/kubectl
          fi

      - name: Install Helm
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

      - name: Install istioctl
        run: |
          if ! command -v istioctl &>/dev/null; then
            curl -fsSLo /tmp/istioctl.tar.gz \
              https://github.com/istio/istio/releases/download/1.16.7/istioctl-1.16.7-linux-amd64.tar.gz
            curl -fsSLo /tmp/istioctl.tar.gz.sha256 \
              https://github.com/istio/istio/releases/download/1.16.7/istioctl-1.16.7-linux-amd64.tar.gz.sha256
            echo "$(cat /tmp/istioctl.tar.gz.sha256)  /tmp/istioctl.tar.gz" | sha256sum -c -
            tar -xzf /tmp/istioctl.tar.gz -C /tmp istioctl
            sudo install -m 0755 /tmp/istioctl /usr/local/bin/istioctl
          fi

      - name: Create e2e VMs
        run: VM_MEMORY=2048 ./scripts/vm-init.sh --name e2e --count 2 --force

      - name: Run e2e tests
        run: |
          mkdir -p test-results
          bats --formatter tap --report-formatter junit --output test-results \
            --print-output-on-failure --show-output-of-passing-tests --verbose-run -x test/e2e/

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: test-results/*.xml
          reporter: java-junit

      - name: Cleanup
        if: always()
        run: |
          ./scripts/vm-destroy.sh --name e2e --count 2
          minikube delete --profile av-scanner || true
