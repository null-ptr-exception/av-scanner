---
# deploy.yaml - Set up VM and deploy AV Scanner
#
# Combines VM setup (ClamAV) and app deployment into a single idempotent playbook.
# Can be run repeatedly — only changed state is applied.
#
# Usage:
#   # From a CronJob deployer pod:
#   ansible-playbook deploy.yaml -i inventory.yaml \
#     -e binary_path=/app/av-scanner \
#     -e token_file=/tmp/sa-token
#
#   # Local dev (binary already built):
#   ansible-playbook deploy.yaml -i inventory.yaml \
#     -e binary_path=../av-scanner

- name: Deploy AV Scanner to VM
  hosts: "{{ target_host | default('av-scanner') }}"
  become: true
  gather_facts: true

  vars:
    av_engine: clamav
    scan_dir: /tmp/av-scanner
    clamav_log_dir: /var/log/clamav
    k8s_auth_token_path: /etc/av-scanner/sa-token

  tasks:
    # ============================================
    # System Setup
    # ============================================
    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      failed_when: false
      timeout: 300

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    # ============================================
    # ClamAV Installation
    # ============================================
    - name: Install ClamAV and dependencies
      apt:
        name:
          - clamav
          - clamav-daemon
          - clamav-freshclam
          - moreutils
          - python3
          - python3-apt
        state: present

    # ============================================
    # Scan Directory Setup
    # ============================================
    - name: Create scan directory
      file:
        path: "{{ scan_dir }}"
        state: directory
        mode: "0777"

    - name: Mount tmpfs for scan directory (enables fanotify)
      mount:
        path: "{{ scan_dir }}"
        src: tmpfs
        fstype: tmpfs
        opts: size=512M,mode=0777
        state: mounted

    # ============================================
    # ClamAV Database Update
    # ============================================
    - name: Stop freshclam service temporarily
      systemd:
        name: clamav-freshclam
        state: stopped
      failed_when: false

    - name: Update ClamAV database (this may take a while)
      command: freshclam
      register: freshclam_result
      changed_when: "'Database updated' in freshclam_result.stdout or 'is up-to-date' not in freshclam_result.stdout"
      failed_when: false
      timeout: 600

    - name: Start freshclam service
      systemd:
        name: clamav-freshclam
        state: started
        enabled: true

    # ============================================
    # ClamAV Daemon Configuration
    # ============================================
    - name: Wait for ClamAV database files
      wait_for:
        path: "/var/lib/clamav/{{ item }}"
        state: present
        timeout: 600
      loop:
        - daily.cvd
        - main.cvd
      failed_when: false

    - name: Ensure ClamAV daemon is enabled and started
      systemd:
        name: clamav-daemon
        state: started
        enabled: true
      register: clamav_daemon_start
      retries: 5
      delay: 10
      until: clamav_daemon_start is succeeded

    # ============================================
    # ClamAV On-Access Scanning (clamonacc)
    # ============================================
    - name: Configure ClamAV on-access scanning
      blockinfile:
        path: /etc/clamav/clamd.conf
        marker: "# {mark} ANSIBLE MANAGED - On-Access Scanning"
        block: |
          OnAccessMountPath {{ scan_dir }}
          OnAccessExcludeUname clamav
          OnAccessPrevention yes
          LogTime yes
      notify: Restart ClamAV daemon

    - name: Create clamonacc systemd service
      copy:
        content: |
          [Unit]
          Description=ClamAV On-Access Scanner
          Requires=clamav-daemon.service
          After=clamav-daemon.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/sbin/clamonacc --foreground --log={{ clamav_log_dir }}/clamonacc.log --move={{ scan_dir }}/quarantine
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/clamav-clamonacc.service
        mode: "0644"
      notify: Restart clamonacc

    - name: Create quarantine directory
      file:
        path: "{{ scan_dir }}/quarantine"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Ensure clamonacc log file exists
      file:
        path: "{{ clamav_log_dir }}/clamonacc.log"
        state: touch
        owner: clamav
        group: clamav
        mode: "0644"
      changed_when: false

    - name: Enable and start clamonacc
      systemd:
        name: clamav-clamonacc
        state: started
        enabled: true
        daemon_reload: true
      failed_when: false

    # ============================================
    # AV Scanner Binary
    # ============================================
    - name: Copy av-scanner binary to VM
      copy:
        src: "{{ binary_path }}"
        dest: /usr/local/bin/av-scanner
        mode: "0755"
        owner: root
        group: root
      when: binary_path is defined
      notify: Restart av-scanner

    # ============================================
    # Auth Configuration
    # ============================================
    - name: Create av-scanner config directory
      file:
        path: /etc/av-scanner
        state: directory
        mode: "0755"

    - name: Write allowlist file
      copy:
        content: "{{ auth_allowlist_content }}"
        dest: "{{ auth_allowlist_file | default('/etc/av-scanner/allowlist.yaml') }}"
        mode: "0644"
      when: auth_allowlist_content is defined
      notify: Restart av-scanner

    - name: Copy SA token file to VM
      copy:
        src: "{{ token_file }}"
        dest: "{{ k8s_auth_token_path }}"
        mode: "0600"
        owner: root
        group: root
      when: token_file is defined

    # ============================================
    # Systemd Service Configuration
    # ============================================
    - name: Create av-scanner systemd service
      copy:
        content: |
          [Unit]
          Description=AV Scanner Service
          After=network.target clamav-daemon.service clamav-clamonacc.service

          [Service]
          Type=simple
          User=root
          Environment=PORT=3000
          Environment=AV_ENGINE={{ av_engine }}
          Environment=UPLOAD_DIR=/tmp/av-scanner
          Environment=CLAMAV_RTS_LOG_PATH=/var/log/clamav/clamonacc.log
          Environment=TM_RTS_LOG_PATH=/var/log/ds_agent/ds_agent.log
          Environment=LOG_LEVEL=info
          Environment=AUTH_ENABLED={{ auth_enabled | default(false) | string | lower }}
          Environment=K8S_API_ENDPOINT={{ k8s_api_endpoint | default('') }}
          Environment=AUTH_ALLOWLIST_FILE={{ auth_allowlist_file | default('/etc/av-scanner/allowlist.yaml') }}
          Environment=K8S_AUTH_TOKEN_PATH={{ k8s_auth_token_path }}
          ExecStart=/usr/local/bin/av-scanner
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/av-scanner.service
        mode: "0644"
      notify: Restart av-scanner

    - name: Enable and start av-scanner service
      systemd:
        name: av-scanner
        state: started
        enabled: true
        daemon_reload: true

    # Flush handlers now so any pending restart happens before verification
    - meta: flush_handlers

    # ============================================
    # Verification
    # ============================================
    - name: Wait for service to be ready
      uri:
        url: "http://localhost:3000/api/v1/live"
        method: GET
        status_code: [200]
      register: health_check
      until: health_check.status == 200
      retries: 30
      delay: 2

    - name: Display service status
      debug:
        msg: "AV Scanner is running at http://{{ ansible_host }}:3000"

  handlers:
    - name: Restart ClamAV daemon
      systemd:
        name: clamav-daemon
        state: restarted
        daemon_reload: true

    - name: Restart clamonacc
      systemd:
        name: clamav-clamonacc
        state: restarted
        daemon_reload: true

    - name: Restart av-scanner
      systemd:
        name: av-scanner
        state: restarted
        daemon_reload: true
