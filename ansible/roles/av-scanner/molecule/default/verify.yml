---
- name: Verify av-scanner deployment
  hosts: all
  become: true
  gather_facts: false
  vars:
    av_engine: "{{ lookup('env', 'MOLECULE_AV_ENGINE') | default('clamav', true) }}"
  tasks:
    - name: av-scanner binary exists
      stat:
        path: /usr/local/bin/av-scanner
      register: binary
      failed_when: not binary.stat.exists

    - name: av-scanner service is running
      systemd:
        name: av-scanner
      register: svc
      failed_when: svc.status.ActiveState != "active"

    - name: av-scanner health check responds
      uri:
        url: "http://localhost:{{ port | default(3000) }}/api/v1/live"
        method: GET
        status_code: [200]
      register: health
      until: health.status == 200
      retries: 10
      delay: 2

    - name: ClamAV daemon is running
      systemd:
        name: clamav-daemon
      register: clamav
      failed_when: clamav.status.ActiveState != "active"
      when: av_engine == "clamav"

    - name: clamonacc is running
      systemd:
        name: clamav-clamonacc
      register: clamonacc
      failed_when: clamonacc.status.ActiveState != "active"
      when: av_engine == "clamav"

    - name: node_exporter is running
      systemd:
        name: node_exporter
      register: ne
      failed_when: ne.status.ActiveState != "active"

    - name: node_exporter metrics endpoint responds
      uri:
        url: "http://localhost:9100/metrics"
        method: GET
        status_code: [200]

    - name: Quarantine directory exists (clamav only)
      stat:
        path: "{{ scan_dir | default('/tmp/av-scanner') }}/quarantine"
      register: quarantine
      failed_when: not quarantine.stat.exists
      when: av_engine == "clamav"

    - name: Quarantine directory does not exist (trendmicro)
      stat:
        path: "{{ scan_dir | default('/tmp/av-scanner') }}/quarantine"
      register: quarantine_tm
      failed_when: quarantine_tm.stat.exists
      when: av_engine == "trendmicro"

    - name: Systemd unit contains CLAMAV_RTS_LOG_PATH (clamav only)
      command: grep -q CLAMAV_RTS_LOG_PATH /etc/systemd/system/av-scanner.service
      changed_when: false
      when: av_engine == "clamav"

    - name: Systemd unit does not contain CLAMAV_RTS_LOG_PATH (trendmicro)
      command: grep -q CLAMAV_RTS_LOG_PATH /etc/systemd/system/av-scanner.service
      register: grep_clamav
      changed_when: false
      failed_when: grep_clamav.rc == 0
      when: av_engine == "trendmicro"

    - name: Systemd unit contains TM_RTS_LOG_PATH (trendmicro only)
      command: grep -q TM_RTS_LOG_PATH /etc/systemd/system/av-scanner.service
      changed_when: false
      when: av_engine == "trendmicro"

    - name: Systemd unit does not contain TM_RTS_LOG_PATH (clamav)
      command: grep -q TM_RTS_LOG_PATH /etc/systemd/system/av-scanner.service
      register: grep_tm
      changed_when: false
      failed_when: grep_tm.rc == 0
      when: av_engine == "clamav"

    - name: Systemd unit does not reference clamav services (trendmicro)
      command: grep -qE "clamav-daemon|clamav-clamonacc" /etc/systemd/system/av-scanner.service
      register: grep_after
      changed_when: false
      failed_when: grep_after.rc == 0
      when: av_engine == "trendmicro"
