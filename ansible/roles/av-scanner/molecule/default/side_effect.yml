---
- import_playbook: ../../../../playbooks/restart.yaml

- name: Verify both VMs healthy after rolling restart
  hosts: all
  gather_facts: false
  tasks:
    - name: Health check
      uri:
        url: "http://localhost:{{ port | default(3000) }}/api/v1/live"
        method: GET
        status_code: [200]
      register: live_check
      until: live_check.status == 200
      retries: 10
      delay: 3
