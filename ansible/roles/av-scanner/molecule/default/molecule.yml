dependency:
  name: galaxy

driver:
  name: default

platforms:
  - name: vm1
    groups:
      - av_scanner
  - name: vm2
    groups:
      - av_scanner

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    group_vars:
      all:
        av_engine: "{{ lookup('env', 'MOLECULE_AV_ENGINE') | default('clamav', true) }}"
        auth_enabled: "{{ lookup('env', 'MOLECULE_AUTH_ENABLED') | default(false, true) }}"
        k8s_api_endpoint: "{{ lookup('env', 'MOLECULE_K8S_API_ENDPOINT') | default('', true) }}"
        auth_allowlist_content: "{{ lookup('file', lookup('env', 'MOLECULE_AUTH_ALLOWLIST_FILE')) if lookup('env', 'MOLECULE_AUTH_ALLOWLIST_FILE') else '' }}"
    host_vars:
      vm1:
        ansible_host: ${MOLECULE_VM1_IP}
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ${MOLECULE_SSH_KEY}
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      vm2:
        ansible_host: ${MOLECULE_VM2_IP}
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ${MOLECULE_SSH_KEY}
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

verifier:
  name: ansible
