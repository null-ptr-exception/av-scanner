- name: Create node_exporter system user
  user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Copy node_exporter binary to VM
  copy:
    src: "{{ node_exporter_path }}"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    owner: root
    group: root
  when: node_exporter_path is defined
  notify: Restart node_exporter

- name: Create node_exporter systemd service
  copy:
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      Type=simple
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Verify node_exporter is responding
  uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    method: GET
    status_code: 200
  register: metrics_check
  until: metrics_check.status == 200
  retries: 5
  delay: 2

- name: Display node_exporter status
  debug:
    msg: "node_exporter is running at http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"
