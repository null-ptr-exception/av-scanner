- name: Copy av-scanner binary to VM
  copy:
    src: "{{ binary_path }}"
    dest: /usr/local/bin/av-scanner
    mode: "0755"
    owner: root
    group: root
  when: binary_path is defined
  notify: Restart av-scanner

- name: Create av-scanner config directory
  file:
    path: /etc/av-scanner
    state: directory
    mode: "0755"

- name: Write allowlist file
  copy:
    content: "{{ auth_allowlist_content }}"
    dest: "{{ auth_allowlist_file | default('/etc/av-scanner/allowlist.yaml') }}"
    mode: "0644"
  when: auth_allowlist_content is defined and auth_allowlist_content | length > 0
  notify: Restart av-scanner

- name: Copy SA token file to VM
  copy:
    src: "{{ token_file }}"
    dest: "{{ k8s_auth_token_path }}"
    mode: "0600"
    owner: root
    group: root
  when: token_file is defined and token_file | length > 0

- name: Create av-scanner systemd service
  copy:
    content: |
      [Unit]
      Description=AV Scanner Service
      After=network.target{% if av_engine == "clamav" %} clamav-daemon.service clamav-clamonacc.service{% endif %}

      [Service]
      Type=simple
      User=root
      Environment=PORT={{ port }}
      Environment=AV_ENGINE={{ av_engine }}
      Environment=UPLOAD_DIR={{ scan_dir }}
      {% if av_engine == "clamav" %}
      Environment=CLAMAV_RTS_LOG_PATH={{ clamav_rts_log_path }}
      {% endif %}
      {% if av_engine == "trendmicro" %}
      Environment=TM_RTS_LOG_PATH={{ tm_rts_log_path }}
      {% endif %}
      Environment=LOG_LEVEL={{ log_level }}
      Environment=AUTH_ENABLED={{ auth_enabled | default(false) | string | lower }}
      Environment=K8S_API_ENDPOINT={{ k8s_api_endpoint | default('') }}
      Environment=AUTH_ALLOWLIST_FILE={{ auth_allowlist_file | default('/etc/av-scanner/allowlist.yaml') }}
      Environment=K8S_AUTH_TOKEN_PATH={{ k8s_auth_token_path }}
      ExecStart=/usr/local/bin/av-scanner
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/av-scanner.service
    mode: "0644"
  notify: Restart av-scanner

- name: Enable and start av-scanner service
  systemd:
    name: av-scanner
    state: started
    enabled: true
    daemon_reload: true

- meta: flush_handlers

- name: Wait for service to be ready
  uri:
    url: "http://localhost:{{ port }}/api/v1/live"
    method: GET
    status_code: [200]
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 2

- name: Display service status
  debug:
    msg: "AV Scanner is running at http://{{ ansible_host }}:{{ port }}"
