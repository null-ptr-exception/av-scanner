dependency:
  name: galaxy

driver:
  name: default

platforms:
  - name: vm1
    groups:
      - av_scanner

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      vm1:
        ansible_host: ${AV_SCANNER_VM1_IP}
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ${AV_SCANNER_SSH_KEY:-/ssh/id_ed25519}
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

verifier:
  name: ansible
