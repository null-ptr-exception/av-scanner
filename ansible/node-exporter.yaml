---
# node-exporter.yaml - Install Prometheus node_exporter on the VM
#
# Usage:
#   make setup-node-exporter
#
- name: Install node_exporter
  hosts: "{{ target_host | default('av-scanner') }}"
  become: true
  gather_facts: true

  vars:
    node_exporter_version: "1.9.0"
    node_exporter_user: node_exporter
    node_exporter_port: 9100

  tasks:
    - name: Create node_exporter system user
      user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Check if node_exporter is already installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Check installed version
      command: /usr/local/bin/node_exporter --version
      register: installed_version
      changed_when: false
      failed_when: false
      when: node_exporter_bin.stat.exists

    - name: Download and install node_exporter
      when: >
        not node_exporter_bin.stat.exists or
        node_exporter_version not in (installed_version.stderr | default(''))
      block:
        - name: Download node_exporter tarball
          get_url:
            url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
            dest: /tmp/node_exporter.tar.gz
            mode: "0644"

        - name: Extract node_exporter binary
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp
            remote_src: true

        - name: Install node_exporter binary
          copy:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
            dest: /usr/local/bin/node_exporter
            mode: "0755"
            remote_src: true
          notify: Restart node_exporter

        - name: Clean up tarball
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/node_exporter.tar.gz
            - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

    - name: Create node_exporter systemd service
      copy:
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          Type=simple
          User={{ node_exporter_user }}
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true

    - name: Verify node_exporter is responding
      uri:
        url: "http://localhost:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: metrics_check
      until: metrics_check.status == 200
      retries: 5
      delay: 2

    - name: Display status
      debug:
        msg: "node_exporter is running at http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"

  handlers:
    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
