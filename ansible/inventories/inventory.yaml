all:
  hosts:
    av-scanner:
      # Connection settings — override with env vars or -e flags.
      # VM IP is assigned by libvirt (virsh domifaddr av-scanner).
      ansible_host: "{{ lookup('env', 'AV_SCANNER_IP') | default('192.168.122.2', true) }}"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ lookup('env', 'AV_SCANNER_KEY') | default(lookup('env', 'HOME') + '/.ssh/id_ed25519', true) }}"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      ansible_python_interpreter: /usr/bin/python3
